<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rulers of the Sky</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: sans-serif;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const go = new Go();
      try {
        const result = await WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject);
        document.getElementById("loading").style.display = "none";
        await go.run(result.instance);
      } catch (err) {
        document.getElementById("loading").textContent = "Failed to load game: " + err.message;
        console.error(err);
      }
    })();
  </script>
</body>
</html>
